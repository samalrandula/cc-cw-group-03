spring.application.name=report_service
# 8084 is search_service; keep report on a dedicated port for local runs with BFF.
server.port=8087

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Service URLs
salary.submission.service.url=${SALARY_SUBMISSION_SERVICE_URL}

logging.level.lk.zalary.report_service=DEBUG
logging.level.org.liquibase=DEBUG

#health check
management.endpoints.web.exposure.include=health
