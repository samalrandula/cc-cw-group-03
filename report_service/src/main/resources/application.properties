spring.application.name=report_service
server.port=8084

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=zalary&searchpath=zalary,public
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Reporting: flag submission after this many reports (override via env REPORT_FLAG_THRESHOLD)
report.flag.threshold=3

# Service URLs
salary.submission.service.url=http://localhost:8082

logging.level.lk.zalary.report_service=DEBUG
logging.level.org.liquibase=DEBUG
