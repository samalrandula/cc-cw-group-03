spring.application.name=identity_service
server.port=8081

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=zalary
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

logging.level.org.liquibase=DEBUG

# JWT configuration - change secret for production
security.jwt.secret=changemechangemechangemechangemechangemechangemechangemechangeme
security.jwt.expiration-ms=3600000