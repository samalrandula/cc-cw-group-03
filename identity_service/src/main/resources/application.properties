spring.application.name=identity_service
server.port=8086

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

logging.level.org.liquibase=DEBUG

# JWT configuration - change secret for production
security.jwt.secret=changemechangemechangemechangemechangemechangemechangemechangeme
security.jwt.expiration-ms=3600000

#health check
management.endpoints.web.exposure.include=health