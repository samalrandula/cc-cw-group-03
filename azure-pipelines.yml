trigger:
  - main

pool:
  name: Default

variables:
  DOCKER_REGISTRY: samalrandula

stages:

  # =============================
  # BUILD STAGE
  # =============================
  - stage: Build
    displayName: Build and Push Images

    jobs:
      - job: BuildImages
        displayName: Build Services

        steps:

          - checkout: self
            fetchDepth: 0

          # -----------------------------
          # Detect Changed Services
          # -----------------------------
          - script: |
              echo "Detecting changed services..."
              
              git fetch origin $(Build.SourceBranchName)
              
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              
              echo "$CHANGED_FILES"
              
              echo "##vso[task.setvariable variable=salaryChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=bffChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=voteChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=searchChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=statsChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=identityChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=reportChanged;isOutput=true]false"
              echo "##vso[task.setvariable variable=frontendChanged;isOutput=true]false"
              
              if echo "$CHANGED_FILES" | grep -q "^bff_service/"; then
                echo "##vso[task.setvariable variable=bffChanged;isOutput=true]true"
              fi
              
              if echo "$CHANGED_FILES" | grep -q "^frontend_service/"; then
                echo "##vso[task.setvariable variable=frontendChanged;isOutput=true]true"
              fi
            name: detectChanges
            displayName: Detect changed services

          # -----------------------------
          # Login to Docker Hub
          # -----------------------------
          - task: Docker@2
            displayName: Login to Docker
            inputs:
              command: login
              containerRegistry: dockerhub-connection

          # -----------------------------
          # Build & Push BFF
          # -----------------------------
          - task: Docker@2
            displayName: Build & Push bff-service
            condition: eq(variables['bffChanged'], 'true')
            inputs:
              command: buildAndPush
              repository: $(DOCKER_REGISTRY)/bff-service
              dockerfile: bff_service/dockerfile
              buildContext: bff_service
              tags: |
                latest
                $(Build.BuildId)

          # -----------------------------
          # Build & Push Frontend
          # -----------------------------
          - task: Docker@2
            displayName: Build & Push frontend-service
            condition: eq(variables['frontendChanged'], 'true')
            inputs:
              command: buildAndPush
              repository: $(DOCKER_REGISTRY)/frontend-service
              dockerfile: frontend_service/dockerfile
              buildContext: frontend_service
              tags: |
                latest
                $(Build.BuildId)

  # =============================
  # DEPLOY STAGE
  # =============================
  - stage: Deploy
    displayName: Deploy to Kubernetes
    dependsOn: Build

    variables:
      bffChanged: $[ stageDependencies.Build.BuildImages.outputs['detectChanges.bffChanged'] ]
      frontendChanged: $[ stageDependencies.Build.BuildImages.outputs['detectChanges.frontendChanged'] ]

    jobs:
      - job: DeployToK8s
        displayName: Deploy BFF & Frontend

        steps:

          - checkout: self

          # -----------------------------
          # Setup kubectl
          # -----------------------------
          - task: DownloadSecureFile@1
            name: kubeconfig
            inputs:
              secureFile: kubeconfig.yaml

          - script: |
              mkdir -p ~/.kube
              cp $(kubeconfig.secureFilePath) ~/.kube/config
              chmod 600 ~/.kube/config
              
              kubectl get nodes
            displayName: Configure kubectl

          # -----------------------------
          # Apply Services
          # -----------------------------
          - script: |
              kubectl apply -f k8s/services/bff-service.yaml
              kubectl apply -f k8s/services/frontend-service.yaml
            displayName: Apply Services

          # -----------------------------
          # Apply Deployments
          # -----------------------------
          - script: |
              kubectl apply -f k8s/deployments/bff-deployment.yaml
              kubectl apply -f k8s/deployments/frontend-deployment.yaml
            displayName: Apply Deployments

          # -----------------------------
          # Restart if changed
          # -----------------------------
          - script: |
              if [ "$(bffChanged)" = "true" ]; then
                kubectl rollout restart deployment/bff-service
              fi
              
              if [ "$(frontendChanged)" = "true" ]; then
                kubectl rollout restart deployment/frontend-service
              fi
            displayName: Restart Changed Deployments

          # -----------------------------
          # Wait for rollout
          # -----------------------------
          - script: |
              kubectl rollout status deployment/bff-service --timeout=180s
              kubectl rollout status deployment/frontend-service --timeout=180s
            displayName: Wait for Rollout

          # -----------------------------
          # Verify
          # -----------------------------
          - script: |
              kubectl get pods
              kubectl get svc
            displayName: Verify Deployment