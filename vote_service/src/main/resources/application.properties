spring.application.name=vote_service
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/zalary
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=zalary

# Voting Configuration
vote.approval.threshold=5
salary.submission.service.url=http://localhost:8081

# Logging
logging.level.lk.zalary.vote_service=DEBUG
