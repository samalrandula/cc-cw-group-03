spring.application.name=vote_service
server.port=8083

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=zalary&searchpath=zalary,public
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Voting Configuration
vote.approval.threshold=5
vote.rejection.threshold=3

# Service URLs
salary.submission.service.url=http://localhost:8082

# Logging
logging.level.lk.zalary.vote_service=DEBUG
logging.level.org.liquibase=DEBUG
