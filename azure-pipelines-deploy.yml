trigger: none
pr: none

parameters:
  - name: imageTag
    displayName: Image tag to deploy
    type: string
    default: latest

variables:
  azureServiceConnection: azure-aks-connection
  resourceGroup: rg-microservices
  aksCluster: microservices-aks1
  namespaceApp: app

pool:
  name: Default

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Connect to AKS
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --admin --overwrite-existing
        kubectl get nodes

  - task: AzureCLI@2
    displayName: Apply Kubernetes manifests
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --admin --overwrite-existing

        kubectl apply -f k8s/namespaces/namespaces.yaml
        kubectl apply -f k8s/postgres/
        kubectl apply -f k8s/configmaps/
        kubectl apply -f k8s/secrets/
        kubectl apply -f k8s/services/
        kubectl apply -f k8s/deployments/
        kubectl apply -f k8s/ingress/

  - task: AzureCLI@2
    displayName: Update images
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --admin --overwrite-existing

        kubectl set image deployment/frontend-service frontend-service=samalrandula/frontend-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/bff-service bff-service=samalrandula/bff-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/identity-service identity-service=samalrandula/identity-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/search-service search-service=samalrandula/search-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/vote-service vote-service=samalrandula/vote-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/stats-service stats-service=samalrandula/stats-service:${{ parameters.imageTag }} -n $(namespaceApp)
        kubectl set image deployment/report-service report-service=samalrandula/report-service:${{ parameters.imageTag }} -n $(namespaceApp)

  - task: AzureCLI@2
    displayName: Wait for rollout
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --admin --overwrite-existing

        kubectl rollout status deployment/frontend-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/bff-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/identity-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/search-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/vote-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/stats-service -n $(namespaceApp) --timeout=240s
        kubectl rollout status deployment/report-service -n $(namespaceApp) --timeout=240s

        kubectl get pods -n $(namespaceApp)