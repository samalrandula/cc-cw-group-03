name: Build and Push Docker Image

# Trigger workflow on push to main branch or manually
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Login to Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      # Step 3: Login to ACR
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: zalarycontainerregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 4: Build Docker image
      - name: Build Docker image
        working-directory: ./salary-submission-service
        run: |
          docker build -t zalarycontainerregistry.azurecr.io/salary-submission-service:latest .

      # Step 5: Push Docker image to ACR
      - name: Push Docker image
        run: |
          docker push zalarycontainerregistry.azurecr.io/salary-submission-service:latest