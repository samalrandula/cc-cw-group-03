apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: data
data:
  init.sql: |
    CREATE SCHEMA IF NOT EXISTS identity;
    CREATE SCHEMA IF NOT EXISTS salary;
    CREATE SCHEMA IF NOT EXISTS community;

    CREATE TYPE salary.salary_status_enum AS ENUM ('PENDING', 'APPROVED', 'REJECTED');
    CREATE TYPE salary.experience_level_enum AS ENUM ('JUNIOR', 'MID', 'SENIOR', 'LEAD');

    CREATE TABLE salary.salary_submissions (
        salary_submission_id int4 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        company varchar(255) NOT NULL,
        country varchar(255) NOT NULL,
        "role" varchar(255) NOT NULL,
        salary numeric(38,2) NOT NULL,
        years_of_experience int4 NOT NULL,
        currency varchar(255) NULL,
        experience_level salary.experience_level_enum NOT NULL,
        status salary.salary_status_enum DEFAULT 'PENDING'::salary.salary_status_enum NOT NULL,
        anonymize bool DEFAULT false NOT NULL,
        submitted_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE identity.users (
        user_id int4 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TYPE community.vote_type AS ENUM ('UPVOTE', 'DOWNVOTE');

    CREATE TABLE community.votes (
        vote_id int4 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        user_id int4 NOT NULL,
        salary_submission_id int4 NOT NULL,
        vote_type community.vote_type NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_votes_user FOREIGN KEY (user_id) REFERENCES identity.users(user_id) ON DELETE CASCADE,
        CONSTRAINT fk_votes_salary_submission FOREIGN KEY (salary_submission_id) REFERENCES salary.salary_submissions(salary_submission_id) ON DELETE CASCADE,
        CONSTRAINT unique_user_submission_vote UNIQUE (user_id, salary_submission_id)
    );

    CREATE TABLE community.reports (
        report_id int4 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        user_id int4 NOT NULL,
        salary_submission_id int4 NOT NULL,
        reason TEXT,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_reports_user FOREIGN KEY (user_id) REFERENCES identity.users(user_id) ON DELETE CASCADE,
        CONSTRAINT fk_reports_submission FOREIGN KEY (salary_submission_id) REFERENCES salary.salary_submissions(salary_submission_id) ON DELETE CASCADE,
        CONSTRAINT unique_user_submission_report UNIQUE (user_id, salary_submission_id)
    );